[project]
name = "vpnleakcheck"
version = "0.1.0"
description = "Check in one command whether your VPN is protecting you on the current network."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miray Hirabayashi" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.29.1",
]

[project.scripts]
vpnleakcheck = "vpnleakcheck.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: style, F: pyflakes (unused names, undefined names), I: import order,
# UP: modern Python syntax, B: common bug patterns, SIM: simpler code.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
